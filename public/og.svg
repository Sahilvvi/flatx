<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.5" stop-color="#0b6e4f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Map pins -->
  <g transform="translate(820, 140)">
    <g>
      <circle cx="0" cy="0" r="28" fill="#ff6b35"/>
      <circle cx="0" cy="0" r="10" fill="#ffffff"/>
    </g>
  </g>
  <g transform="translate(970, 300)">
    <circle cx="0" cy="0" r="22" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>
  <g transform="translate(740, 420)">
    <circle cx="0" cy="0" r="18" fill="#10b981"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
  </g>
  <g transform="translate(1050, 500)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Logo badge -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="18" fill="#ffffff"/>
    <text x="40" y="54" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" fill="#0b6e4f" text-anchor="middle">MR</text>
  </g>
  <text x="180" y="132" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="600" fill="#ffffff" opacity="0.85">Mumbai Rent Intelligence</text>

  <!-- Headline -->
  <text x="80" y="280" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="800" fill="#ffffff">
    <tspan x="80" dy="0">Broker-free flats,</tspan>
    <tspan x="80" dy="86">rooms &amp; flatmates</tspan>
    <tspan x="80" dy="86" fill="#fbbf24">on a live map.</tspan>
  </text>

  <!-- Feature chips -->
  <g transform="translate(80, 520)">
    <g>
      <rect x="0" y="0" width="260" height="62" rx="31" fill="url(#card)" stroke="rgba(255,255,255,0.25)"/>
      <text x="130" y="40" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">🗺  Real rent pins</text>
    </g>
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="300" height="62" rx="31" fill="url(#card)" stroke="rgba(255,255,255,0.25)"/>
      <text x="150" y="40" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">🚆  Commute zones</text>
    </g>
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="270" height="62" rx="31" fill="url(#card)" stroke="rgba(255,255,255,0.25)"/>
      <text x="135" y="40" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">🤝  Flatmate match</text>
    </g>
  </g>
</svg>
